<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CSS Grid FR</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ddd;
      }

      .container {
        width: 60%;
        margin: 50px auto;
        border: 5px orange solid;
        display: grid;
        /* grid-template-columns: repeat(auto-fit, 100px); menentukan akhir colum secara eksplisit (auto-fill/auto-fit)*/
        /* grid-template-columns: 1fr minmax(200px, 300px) 1fr; membatasi ukuran minimum atau maksimal kolom  */
      }

      .item {
        background-color: rgb(138, 209, 254);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .item:nth-child(even) {
        background-color: rgb(255, 142, 142);
      }
    </style>
  </head>
  <body>
    <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>
    </div>

  </body>
<html>
