<!-- USING CSS GRID -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                html {
            margin: 0;
            padding: 0;
            font-size: 20px;
            font-family: arial;
            color: white;
            text-transform: uppercase;
            text-align: center;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            border: 5px solid black;
            box-sizing: border-box;
            padding: 5px;
            display: grid;
            grid-template-areas: "header header"
                                 "aside main"
                                 "nav main"
                                 "footer footer";
            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: 0.42fr 1fr 1.3fr;
        }

        header {
            grid-area: header;
            background-color: #B063D8;
            display: flex;
            justify-content: center;
            align-items: center;
        }



        aside {
            grid-area: aside;
            background-color: aqua;
            padding: 60px 0;
        }

        nav {
            grid-area: nav;
            background-color: orangered;
            padding: 100px 0;
        }

        main {
            grid-area: main;
            background-color: salmon;
            box-sizing: border-box;
            flex: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        footer {
            grid-area: footer;
            background-color: grey;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <aside>Aside</aside>
        <nav>Nav</nav>
        <main>Main</main>
        <footer>Footer</footer>
    </div>
</body>
</html>
